name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish to GitHub Packages
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          path: source
      - name: Check out publishing tools
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: automation
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Validate tag version
        shell: bash
        working-directory: source
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          release_tag="$RELEASE_TAG"
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${release_tag#v}"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag $release_tag does not match package version $package_version" >&2
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "$release_tag")"
          checked_commit="$(git rev-parse HEAD)"
          if [[ "$tag_commit" != "$checked_commit" ]]; then
            echo "Tag $release_tag does not resolve to checked-out commit $checked_commit" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Tagged commit $tag_commit is not on main" >&2
            exit 1
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_ENV"
      - name: Install dependencies
        working-directory: source
        run: npm ci
      - name: Check package
        working-directory: source
        run: npm run check
      - name: Pack release artifact
        id: pack
        shell: bash
        working-directory: source
        run: |
          tarball="$(npm pack --silent --ignore-scripts)"
          echo "tarball=$GITHUB_WORKSPACE/source/$tarball" >> "$GITHUB_OUTPUT"
      - name: Stage GitHub Package
        id: github-package
        shell: bash
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          package_directory="$RUNNER_TEMP/github-package"
          mkdir -p "$package_directory"
          tar -xzf "$TARBALL" -C "$package_directory"
          node automation/scripts/configure-github-package.mjs "$package_directory/package"
          echo "directory=$package_directory/package" >> "$GITHUB_OUTPUT"
      - name: Set up GitHub Packages
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://npm.pkg.github.com
          scope: '@yiharvest'
      - name: Publish GitHub Package
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          PACKAGE_DIRECTORY: ${{ steps.github-package.outputs.directory }}
        shell: bash
        run: |
          package_version="$(node -p "require('$PACKAGE_DIRECTORY/package.json').version")"
          if npm view "@yiharvest/dsh-failure-capsule@$package_version" version >/dev/null 2>&1; then
            echo "@yiharvest/dsh-failure-capsule@$package_version is already published"
          else
            npm publish "$PACKAGE_DIRECTORY" --ignore-scripts --access public
          fi
      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: gh release create "$release_tag" "$TARBALL" --verify-tag --generate-notes --title "$release_tag"
