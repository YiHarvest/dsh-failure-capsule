name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish to GitHub Packages
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          path: source
      - name: Check out publishing tools
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: automation
      - name: Resolve release
        id: release
        shell: bash
        working-directory: source
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            release_tag="v$package_version"
            if git rev-parse --verify --quiet "refs/tags/$release_tag" >/dev/null; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "$release_tag already exists; nothing to publish"
              exit 0
            fi
          else
            release_tag="$REQUESTED_TAG"
          fi
          tag_version="${release_tag#v}"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag $release_tag does not match package version $package_version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            tag_commit="$(git rev-list -n 1 "$release_tag")"
            checked_commit="$(git rev-parse HEAD)"
            if [[ "$tag_commit" != "$checked_commit" ]]; then
              echo "Tag $release_tag does not resolve to checked-out commit $checked_commit" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
              echo "Tagged commit $tag_commit is not on main" >&2
              exit 1
            fi
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js for npm
        if: steps.release.outputs.publish == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Update npm for trusted publishing
        if: steps.release.outputs.publish == 'true'
        run: npm install --global npm@latest
      - name: Install dependencies
        if: steps.release.outputs.publish == 'true'
        working-directory: source
        run: npm ci
      - name: Check package
        if: steps.release.outputs.publish == 'true'
        working-directory: source
        run: npm run check
      - name: Pack release artifact
        if: steps.release.outputs.publish == 'true'
        id: pack
        shell: bash
        working-directory: source
        run: |
          tarball="$(npm pack --silent --ignore-scripts)"
          echo "tarball=$GITHUB_WORKSPACE/source/$tarball" >> "$GITHUB_OUTPUT"
      - name: Publish npm package
        if: steps.release.outputs.publish == 'true'
        env:
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        shell: bash
        run: |
          if npm view "dsh-failure-capsule@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "dsh-failure-capsule@$PACKAGE_VERSION is already published"
          else
            npm publish "$TARBALL" --ignore-scripts --access public --provenance
          fi
      - name: Stage GitHub Package
        if: steps.release.outputs.publish == 'true'
        id: github-package
        shell: bash
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          package_directory="$RUNNER_TEMP/github-package"
          mkdir -p "$package_directory"
          tar -xzf "$TARBALL" -C "$package_directory"
          node automation/scripts/configure-github-package.mjs "$package_directory/package"
          echo "directory=$package_directory/package" >> "$GITHUB_OUTPUT"
      - name: Set up GitHub Packages
        if: steps.release.outputs.publish == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://npm.pkg.github.com
          scope: '@yiharvest'
      - name: Publish GitHub Package
        if: steps.release.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          PACKAGE_DIRECTORY: ${{ steps.github-package.outputs.directory }}
        shell: bash
        run: |
          package_version="$(node -p "require('$PACKAGE_DIRECTORY/package.json').version")"
          if npm view "@yiharvest/dsh-failure-capsule@$package_version" version >/dev/null 2>&1; then
            echo "@yiharvest/dsh-failure-capsule@$package_version is already published"
          else
            npm publish "$PACKAGE_DIRECTORY" --ignore-scripts --access public
          fi
      - name: Create tag and GitHub Release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        shell: bash
        working-directory: source
        run: |
          if ! git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
            git tag "$RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" "$TARBALL" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
