name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to publish or resume
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Validate and pack
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.release.outputs.artifact }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Resolve and validate release
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]]; then
            echo "Release must run from refs/tags/$RELEASE_TAG, got $GITHUB_REF" >&2
            echo "For a manual retry, select $RELEASE_TAG as the workflow ref." >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Release tag does not exist: $RELEASE_TAG" >&2
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          checked_commit="$(git rev-parse HEAD)"
          if [[ "$tag_commit" != "$checked_commit" ]]; then
            echo "Tag $RELEASE_TAG does not resolve to checked-out commit $checked_commit" >&2
            exit 1
          fi
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Tagged commit $tag_commit is not on main" >&2
            exit 1
          fi
          package_version="$(node -p "require('./package.json').version")"
          if [[ "${RELEASE_TAG#v}" != "$package_version" ]]; then
            echo "Tag $RELEASE_TAG does not match package version $package_version" >&2
            exit 1
          fi
          echo "artifact=dsh-failure-capsule-$package_version" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Check package
        run: npm run check
      - name: Pack release artifact
        shell: bash
        run: |
          mkdir -p dist
          npm pack --ignore-scripts --pack-destination dist
          cd dist
          sha256sum "dsh-failure-capsule-${{ steps.release.outputs.version }}.tgz" > SHA256SUMS
      - name: Upload release artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.release.outputs.artifact }}
          path: |
            dist/dsh-failure-capsule-${{ steps.release.outputs.version }}.tgz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish-npm:
    name: Publish npm
    needs: prepare
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: dist
      - name: Verify release artifact
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Set up Node.js for npm
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Update npm for trusted publishing
        run: npm install --global npm@latest
      - name: Publish npm package
        env:
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          tarball="./dist/dsh-failure-capsule-$PACKAGE_VERSION.tgz"
          if published="$(npm view "dsh-failure-capsule@$PACKAGE_VERSION" version 2>npm-view.err)"; then
            if [[ "$published" != "$PACKAGE_VERSION" ]]; then
              echo "Registry returned unexpected version: $published" >&2
              exit 1
            fi
            local_integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | openssl base64 -A)"
            published_integrity="$(npm view "dsh-failure-capsule@$PACKAGE_VERSION" dist.integrity)"
            if [[ "$published_integrity" != "$local_integrity" ]]; then
              echo "dsh-failure-capsule@$PACKAGE_VERSION exists with different content" >&2
              exit 1
            fi
            echo "dsh-failure-capsule@$PACKAGE_VERSION is already published"
          elif grep -qE 'E404|404 Not Found' npm-view.err; then
            npm publish "$tarball" --ignore-scripts --access public --provenance
          else
            cat npm-view.err >&2
            exit 1
          fi

  publish-github-package:
    name: Publish GitHub Package
    needs: [prepare, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out publishing tools
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Download release artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: dist
      - name: Verify release artifact
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Stage GitHub Package
        id: package
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          package_directory="$RUNNER_TEMP/github-package"
          mkdir -p "$package_directory"
          tar -xzf "dist/dsh-failure-capsule-$PACKAGE_VERSION.tgz" -C "$package_directory"
          node scripts/configure-github-package.mjs "$package_directory/package"
          echo "directory=$package_directory/package" >> "$GITHUB_OUTPUT"
      - name: Set up GitHub Packages
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://npm.pkg.github.com
          scope: '@yiharvest'
          package-manager-cache: false
      - name: Publish GitHub Package
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          PACKAGE_DIRECTORY: ${{ steps.package.outputs.directory }}
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          if published="$(npm view "@yiharvest/dsh-failure-capsule@$PACKAGE_VERSION" version --registry=https://npm.pkg.github.com 2>npm-view.err)"; then
            if [[ "$published" != "$PACKAGE_VERSION" ]]; then
              echo "Registry returned unexpected version: $published" >&2
              exit 1
            fi
            echo "@yiharvest/dsh-failure-capsule@$PACKAGE_VERSION is already published"
          elif grep -qE 'E404|404 Not Found' npm-view.err; then
            npm publish "$PACKAGE_DIRECTORY" --ignore-scripts --access public
          else
            cat npm-view.err >&2
            exit 1
          fi

  github-release:
    name: Create GitHub Release
    needs: [prepare, publish-npm, publish-github-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: dist
      - name: Verify release artifact
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Create or verify GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          tarball="./dist/dsh-failure-capsule-$PACKAGE_VERSION.tgz"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists"
            assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            if ! grep -qxF "$(basename "$tarball")" <<<"$assets"; then
              gh release upload "$RELEASE_TAG" "$tarball" --repo "$GITHUB_REPOSITORY"
            fi
            if ! grep -qxF SHA256SUMS <<<"$assets"; then
              gh release upload "$RELEASE_TAG" dist/SHA256SUMS --repo "$GITHUB_REPOSITORY"
            fi
          else
            gh release create "$RELEASE_TAG" "$tarball" dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi
